# Alembic config. At startup `hoctap.db.engine.run_migrations()` passes its own
# connection. Manual CLI runs (from backend/) use load_settings().db_path via env.py:
#   uv run alembic -c hoctap/db/alembic.ini revision -m "..."
[alembic]
script_location = %(here)s/alembic
path_separator = os
# sqlalchemy.url is not set here: env.py uses load_settings().db_path.

[loggers]
keys = root

[handlers]
keys =

[formatters]
keys =

[logger_root]
level = WARNING
handlers =
